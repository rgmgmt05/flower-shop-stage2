name: Stage 3A tests
on:
  push:
    branches:
      - stage3a/accounts-auth
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-sqlite tests/test-api.mjs
      - run: node tests/test-frontend.mjs
