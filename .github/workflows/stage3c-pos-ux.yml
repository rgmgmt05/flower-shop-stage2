name: Stage 3C POS UX
on:
  push:
    branches:
      - stage3c/pos-ux-staff-ui
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/pos.js
      - run: node --experimental-sqlite tests/test-api.mjs
      - run: node tests/test-stage3b.mjs
      - run: node tests/test-pos.mjs
